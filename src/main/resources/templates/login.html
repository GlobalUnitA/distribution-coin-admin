<!-- src/main/resources/templates/login.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>로그인</title></head>
<body>
<h1>로그인</h1>
<form th:action="@{/login}" th:object="${loginRequest}" method="post">
    <div>
        <label>아이디 : </label>
        <input type="text" th:field="*{username}" name="username" required />
        <div th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
    </div>
    <div>
        <label>비밀번호 : </label>
        <input type="password" th:field="*{password}" required />
        <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
    </div>

    <button type="submit">로그인</button>

    <div th:if="${errorMsg}" th:text="${errorMsg}"></div>
    <div th:if="${logoutMsg}" th:text="${logoutMsg}"></div>
</form>
</body>
</html>
