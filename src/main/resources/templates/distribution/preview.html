<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>USDT 분배 미리보기</title>
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
</head>
<body>

<div class="layout">

    <!-- 사이드바 -->
    <div th:replace="fragments/sidebar :: sidebar"></div>

    <!-- 메인 영역 -->
    <div class="content">
        <h1>분배 미리보기</h1>

        <!-- 상단 요약 박스 -->
        <div class="summary-box">
            <p>네트워크: <span th:text="${networkName}">BEP20</span></p>
            <p>사용가능 수량: <span th:text="${available}">0</span></p>
            <p>출금수량 합계: <span th:text="${totalAmount}">0</span></p>
            <p>GAS 비용: <span th:text="${gasFee}">0</span></p>
        </div>

        <!-- 분배 테이블 -->
        <table border="1" cellspacing="0" cellpadding="4">
            <thead>
            <tr>
                <th>NO.</th>
                <th>이름</th>
                <th>USDT 지갑주소</th>
                <th>USDT 수량</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="row : ${rows}">
                <td th:text="${row.no}">1</td>
                <td th:text="${row.name}">홍길동</td>
                <td th:text="${row.walletAddress}">0x...</td>
                <td th:text="${row.amount}">0</td>
            </tr>
            </tbody>
        </table>

        <form id="executeForm">
            <input type="hidden" id="batchId" name="batchId" th:value="${batchId}">
            <button type="button" onclick="startDistribution()">분배 실행</button>
        </form>

    </div>

    <div style="margin-top: 20px;">
        <div>
            진행률:
            <span id="progressText">대기 중</span>
        </div>

        <div style="width: 300px; height: 20px; border: 1px solid #ccc; margin-top: 5px;">
            <div id="progressBar"
                 style="height: 100%; width: 0%; background-color: #4caf50;"></div>
        </div>

        <div style="margin-top: 5px;">
            상태: <span id="batchStatus">READY</span>
        </div>
    </div>

</div>

<script type="text/javascript">
    function startDistribution() {
        const batchId = document.getElementById("batchId").value;

        fetch('execute',
            {
                method : 'POST',
                headers : {
                    'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8'
                },
                body : 'batchId=' + encodeURIComponent(batchId)
            }).then(function (response){
                if(!response.ok){
                    throw new Error('execute failed');
                }

                startPolling(batchId);
        }).catch(function (error) {
            console.error('execute error',error);
            alert('분배 실행 시작중 오류가 발생했습니다.');
        });
    }

    function startPolling(batchId) {
        const progressText = document.getElementById("progressText");
        const progressBar = document.getElementById("progressBar");
        const statusSpan = document.getElementById("batchStatus");

        progressText.textContent = "0%";
        statusSpan.textContent = "PROCESSING";

        const intervalId = setInterval(function () {
            fetch('/api/distribution/progress?batchId=' + encodeURIComponent(batchId)).then (function (response) {
                if(!response.ok){
                    throw new Error('progress failed');
                }
                return response.json();
            }).then(function (data) {
                const progress = data.progress;
                const status = data.status;

                progressText.textContent = progress + "%";
                progressBar.style.width = progress + "%";
                statusSpan.textContent = status;

                if(status == "DONE" || status == "FAILED"){
                    clearInterval(intervalId);
                    //TODO : 필요하면 결과 화면으로 이동 처리
                    // location.href = '/distribution/result?batchId=' + batchId
                }
            }).catch(function (error) {
                console.error('progress error', error);
            });
        }, 2000); //2초마다 폴링
    }
</script>

</body>
</html>
