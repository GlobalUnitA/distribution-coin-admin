<!-- templates/deposit/select.html -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>입금</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #f5f7fb;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        /* 사이드바 */
        .sidebar {
            width: 220px;
            background-color: #ffffff;
            border-right: 1px solid #dde2eb;
        }

        .sidebar-inner {
            padding: 24px 16px;
        }

        .sidebar-section + .sidebar-section {
            margin-top: 32px;
        }

        .sidebar-section-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .sidebar-menu {
            list-style: none;
        }

        .sidebar-item {
            margin: 4px 0;
        }

        .sidebar-item a {
            text-decoration: none;
            font-size: 14px;
            color: #333;
        }

        .sidebar-item.active a {
            font-weight: 700;
            color: #1864ab;
        }

        /* 메인 컨텐츠 */
        .content {
            flex: 1;
            padding: 32px 40px;
        }

        .page-title {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 40px;
        }

        .form-row {
            display: flex;
            align-items: center;
            margin-bottom: 24px;
        }

        .label-box {
            width: 160px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #cbe7ff;
            border-radius: 4px;
            font-size: 20px;
            font-weight: 700;
            margin-right: 24px;
        }

        .select-wrapper {
            position: relative;
            display: inline-block;
        }

        .select-box {
            min-width: 220px;
            height: 48px;
            padding: 0 40px 0 16px;
            font-size: 20px;
            border-radius: 4px;
            border: 1px solid #ccd3e0;
            background-color: #ffffff;
            appearance: none;
            -moz-appearance: none;
            -webkit-appearance: none;
        }

        .select-arrow {
            pointer-events: none;
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 8px solid #444;
        }

        .hint-text {
            margin-top: 8px;
            font-size: 12px;
            color: #888;
        }

        /* 네트워크 선택 오른쪽 영역 예시 */
        .network-extra {
            margin-left: 40px;
        }

        .network-extra .select-box {
            min-width: 320px;
        }
    </style>
</head>
<body>
<div class="layout">
    <!-- 공통 사이드바 include -->
    <div th:replace="fragments/sidebar :: sidebar"></div>

    <!-- 메인 컨텐츠 -->
    <main class="content">
        <div class="page-title">입금</div>

        <!-- 코인 선택 -->
        <div class="form-row">
            <div class="label-box">코인선택</div>
            <div class="select-wrapper">
                <select class="select-box" name="coin">
                    <option value="USDT" selected>USDT</option>
                    <option value="USDT-2">USDT</option>
                    <option value="BTC">BTC</option>
                    <option value="ETH">ETH</option>
                    <option value="FIL">FIL</option>
                </select>
                <span class="select-arrow"></span>
            </div>
        </div>

        <!-- 네트워크 선택 -->
        <div class="form-row">
            <div class="label-box">네트워크 선택</div>

            <div class="select-wrapper">
                <select class="select-box" name="network">
                    <option value="">네트워크 선택</option>
                    <option value="BSC">BSC (Binance Smart Chain)</option>
                    <option value="ETH">Ethereum</option>
                    <option value="TRON">TRON (TRC-20)</option>
                    <option value="BTC">Bitcoin</option>
                    <option value="FIL">Filecoin</option>
                </select>
                <span class="select-arrow"></span>
            </div>

        </div>
    </main>
</div>
</body>
</html>
